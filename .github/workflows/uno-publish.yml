      #     mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
      #     echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/voicetype.mobileprovision"
