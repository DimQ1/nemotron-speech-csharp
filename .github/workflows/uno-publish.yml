name: VoiceType.Uno publish (reusable)

# One definition of the platform packages, called by build-voicetype-uno.yml (CI artifacts),
# release-voicetype-uno.yml (tag uno-v*) and release-voicetype-uno-android.yml (tag uno-android-v*).
# It replaces the Windows / Linux / Android job copies that lived in all three workflows.
# Artifact names are unchanged (VoiceType.Uno-win-x64, -linux-x64, -linux-deb-amd64, -android); the opt-in jobs add
# VoiceType.Uno-macos-arm64 (macos) and VoiceType.Uno-ios-simulator / -ios-device-unsigned (ios).

on:
  workflow_call:
    inputs:
      version:
        description: Display version of the app and the .deb, e.g. 1.8.1 or 1.0.123
        type: string
        required: true
      version-code:
        description: Android versionCode / iOS build number; must grow with every upload
        type: number
        default: 1
      windows:
        type: boolean
        default: true
      linux:
        type: boolean
        default: true
      android:
        type: boolean
        default: true
      ios:
        description: Build the iOS head (net10.0-ios) for the Simulator and for a device, both unsigned - see docs/ci.md, iOS
        type: boolean
        default: false
      macos:
        description: Build VoiceType.app for Apple silicon (Skia desktop head + audio helper, ad-hoc signed) - see docs/ci.md, macOS
        type: boolean
        default: false
      require-android-signing:
        description: Fail instead of falling back to the throw-away debug key when the release keystore secrets are missing
        type: boolean
        default: false
      retention-days:
        type: number
        default: 7
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: base64 of the release .keystore
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      # --- iOS signing: only read by the (still commented-out) signed-IPA steps of the ios job ---
      IOS_CERTIFICATE_P12_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        required: false
      APPSTORE_API_KEY_ID:
        required: false
      APPSTORE_API_ISSUER_ID:
        required: false
      APPSTORE_API_PRIVATE_KEY:
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  UNO_PROJECT: apps/VoiceType.Uno/src/VoiceType.Uno/VoiceType.Uno.csproj

jobs:
  windows:
    name: Publish Windows (win-x64, Skia)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build (.NET 10 SDK, NuGet cache, LiteRtLmSharp feed)
        uses: ./.github/actions/setup-build

      - name: Publish VoiceType.Uno (win-x64, self-contained)
        run: >-
          dotnet publish ${{ env.UNO_PROJECT }}
          -c Release -f net10.0-desktop -r win-x64
          -p:ApplicationDisplayVersion=${{ inputs.version }}
          --self-contained true -o build/voicetype-uno-win

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path build/voicetype-uno-win/* -DestinationPath build/VoiceType.Uno-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceType.Uno-win-x64
          path: build/VoiceType.Uno-win-x64.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  linux:
    name: Publish Linux (linux-x64, Skia)
    if: ${{ inputs.linux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build (.NET 10 SDK, NuGet cache, LiteRtLmSharp feed)
        uses: ./.github/actions/setup-build

      - name: Publish VoiceType.Uno (linux-x64, self-contained)
        run: >-
          dotnet publish ${{ env.UNO_PROJECT }}
          -c Release -f net10.0-desktop -r linux-x64
          -p:ApplicationDisplayVersion=${{ inputs.version }}
          --self-contained true -o build/voicetype-uno-linux

      - name: Create archive
        run: tar -czf build/VoiceType.Uno-linux-x64.tar.gz -C build/voicetype-uno-linux .

      - name: Build Debian installer
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PUBLISH_DIR: ${{ github.workspace }}/build/voicetype-uno-linux
        run: bash apps/VoiceType.Uno/src/VoiceType.Uno/build-deb.sh "$PACKAGE_VERSION"

      - name: Install the .deb (checks that the Depends line resolves with apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./build/linux-packages/voicetype-uno_*_amd64.deb
          dpkg -s voicetype-uno | grep -E '^(Package|Version|Depends):'
          test -x /opt/voicetype-uno/VoiceType.Uno

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceType.Uno-linux-x64
          path: build/VoiceType.Uno-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Upload Debian installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceType.Uno-linux-deb-amd64
          path: build/linux-packages
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  android:
    name: Publish Android (AAB + APK)
    if: ${{ inputs.android }}
    # windows-latest is the known-green runner (releases 1.5-1.8). ubuntu-24.04 also builds .NET Android and is
    # faster; switch after a dry run (the steps below are pwsh, so they run on both).
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build (.NET 10 SDK, NuGet cache, LiteRtLmSharp feed)
        uses: ./.github/actions/setup-build

      - name: Install Android workload
        # Not pinned today (latest manifest of the SDK band); pin with `--version <workload set>` for reproducible builds.
        run: dotnet workload install android

      - name: Restore the release keystore (secrets exist only on the main repo, not for fork PRs)
        id: keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ([string]::IsNullOrEmpty($env:KEYSTORE_BASE64) -or [string]::IsNullOrEmpty($env:KEY_ALIAS)) {
            if ('${{ inputs.require-android-signing }}' -eq 'true') { Write-Host '::error::release keystore secrets are missing'; exit 1 }
            $warning = 'No release keystore: the APK/AAB of this run are signed with a throw-away debug key generated on this runner. Every build has a different certificate, so this package cannot update an installed copy (the user must uninstall first, which also deletes the downloaded models) and Google Play will not accept it.'
            Write-Host "::warning::$warning"
            "## :warning: Android package is NOT release-signed`n`n$warning`n`nSee docs/ci.md, Android signing, to add the keystore secrets." >> $env:GITHUB_STEP_SUMMARY
            'signed=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'voicetype-release.keystore'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          # `file:` is supported for aab as well; `env:` is not (docs: "The env: prefix isn't supported when AndroidPackageFormat is aab").
          $storePass = Join-Path $env:RUNNER_TEMP 'store.pass'
          $keyPass = Join-Path $env:RUNNER_TEMP 'key.pass'
          [IO.File]::WriteAllText($storePass, $env:KEYSTORE_PASSWORD)
          [IO.File]::WriteAllText($keyPass, $(if ($env:KEY_PASSWORD) { $env:KEY_PASSWORD } else { $env:KEYSTORE_PASSWORD }))
          'signed=true' >> $env:GITHUB_OUTPUT
          "keystore=$keystore" >> $env:GITHUB_OUTPUT
          "storepass=$storePass" >> $env:GITHUB_OUTPUT
          "keypass=$keyPass" >> $env:GITHUB_OUTPUT

      - name: Publish VoiceType.Uno (net10.0-android, AAB then APK)
        shell: pwsh
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
          KEYSTORE: ${{ steps.keystore.outputs.keystore }}
          STOREPASS: ${{ steps.keystore.outputs.storepass }}
          KEYPASS: ${{ steps.keystore.outputs.keypass }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $common = @('publish', $env:UNO_PROJECT, '-c', 'Release', '-f', 'net10.0-android',
                      '-p:ApplicationDisplayVersion=${{ inputs.version }}',
                      '-p:ApplicationVersion=${{ inputs.version-code }}')
          if ($env:SIGNED -eq 'true') {
            $common += @('-p:AndroidKeyStore=true', "-p:AndroidSigningKeyStore=$env:KEYSTORE", "-p:AndroidSigningKeyAlias=$env:KEY_ALIAS",
                         "-p:AndroidSigningStorePass=file:$env:STOREPASS", "-p:AndroidSigningKeyPass=file:$env:KEYPASS")
          }
          foreach ($format in 'aab', 'apk') {
            dotnet @common "-p:AndroidPackageFormat=$format"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Collect package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/voicetype-uno-android | Out-Null
          $publish = "apps/VoiceType.Uno/src/VoiceType.Uno/bin/Release/net10.0-android/publish"
          Copy-Item "$publish/*-Signed.aab" build/voicetype-uno-android/
          Copy-Item "$publish/*-Signed.apk" build/voicetype-uno-android/
          Get-ChildItem build/voicetype-uno-android | Format-Table Name, Length

      - name: Show the signing certificate
        # Fingerprint to compare with the previous release; with the debug fallback it changes every run.
        shell: pwsh
        continue-on-error: true
        run: |
          $apksigner = Get-ChildItem "$env:ANDROID_HOME/build-tools" -Recurse -Filter 'apksigner*' |
            Where-Object { $_.Extension -in '.bat', '' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          $apk = Get-ChildItem build/voicetype-uno-android/*-Signed.apk | Select-Object -First 1
          $report = & $apksigner.FullName verify --print-certs $apk.FullName | Select-String 'certificate SHA-256'
          $report
          "Android signing certificate (signed=${{ steps.keystore.outputs.signed }}): $report" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceType.Uno-android
          path: build/voicetype-uno-android
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # ------------------------------------------------------------------------------------------------
  # macOS: the Skia desktop head published for osx-arm64, wrapped into VoiceType.app by build-macos-app.sh together with
  # the voicetype-audio helper (Swift: microphone + Core Audio process tap), signed ad hoc, packed as .dmg and .zip.
  # ------------------------------------------------------------------------------------------------
  macos:
    name: Publish macOS (osx-arm64, Skia, ad-hoc signed)
    if: ${{ inputs.macos }}
    # Same image as the iOS job (macOS 26 arm64, Xcode 26.x with the Swift compiler for the helper).
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build (.NET 10 SDK, NuGet cache, LiteRtLmSharp feed)
        uses: ./.github/actions/setup-build

      - name: Fetch the LiteRT-LM runtime for Apple silicon
        # Referenced by VoiceType.Uno.csproj only for RuntimeIdentifier osx-arm64, so the default feed does not carry it.
        shell: pwsh
        run: ./tools/scripts/fetch-litertlmsharp-feed.ps1 -Rid osx-arm64

      - name: Publish VoiceType.Uno (osx-arm64, self-contained)
        run: >-
          dotnet publish ${{ env.UNO_PROJECT }}
          -c Release -f net10.0-desktop -r osx-arm64
          -p:ApplicationDisplayVersion=${{ inputs.version }}
          --self-contained true -o build/voicetype-uno-osx-arm64

      - name: Build VoiceType.app (audio helper, Info.plist, icon, ad-hoc signature), .dmg and .zip
        env:
          APP_VERSION: ${{ inputs.version }}
          PUBLISH_DIR: ${{ github.workspace }}/build/voicetype-uno-osx-arm64
        run: bash apps/VoiceType.Uno/src/VoiceType.Uno/build-macos-app.sh "$APP_VERSION"

      - name: Upload artifact
        # Before the checks, so that a package whose start check fails can still be tried on a real Mac.
        uses: actions/upload-artifact@v4
        with:
          name: VoiceType.Uno-macos-arm64
          path: build/macos-packages
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Check the packed app (signature after unzip, the app starts)
        # Unzips like Finder does (ditto), checks the signature and starts the app through LaunchServices; it must still be
        # running after 40 s. The window is kept as a screenshot.
        run: |
          mkdir -p build/macos-check
          ditto -x -k build/macos-packages/VoiceType.Uno-macos-arm64.zip build/macos-check
          app=build/macos-check/VoiceType.app
          codesign --verify --strict --verbose=2 "$app"
          "$app/Contents/MacOS/voicetype-audio" check
          open "$app"
          sleep 40
          if ! pgrep -x VoiceType.Uno > /dev/null; then
            echo "::error::VoiceType.app is not running 40 s after it was opened"
            # What it says when started directly (stdout/stderr of the .NET host), then the crash report macOS wrote.
            "$app/Contents/MacOS/VoiceType.Uno" > build/macos-check/direct.log 2>&1 &
            sleep 30
            pkill -x VoiceType.Uno || true
            echo "---- direct start, last 120 lines"; tail -n 120 build/macos-check/direct.log
            find "$HOME/Library/Application Support/VoiceType" -name '*.log' -exec tail -n 60 {} \; 2>/dev/null || true
            report=$(find "$HOME/Library/Logs/DiagnosticReports" -name 'VoiceType*' -newer "$app/Contents/Info.plist" 2>/dev/null | head -n 1)
            if [[ -n "$report" ]]; then echo "---- $report"; head -c 6000 "$report"; fi
            exit 1
          fi
          screencapture -x build/macos-check/started.png || true
          pkill -x VoiceType.Uno || true

      - name: Probe the capture helper on the runner (information only)
        # A hosted runner has no microphone and grants no audio permissions, so this only shows what the helper reports.
        continue-on-error: true
        run: |
          helper=build/macos-check/VoiceType.app/Contents/MacOS/voicetype-audio
          for mode in mic system; do
            bytes=$( (sleep 3 | perl -e 'alarm 15; exec @ARGV' "$helper" "$mode" 2> "build/macos-check/$mode.log") | wc -c)
            echo "$mode: $bytes bytes in 3 s; stderr: $(tr '\n' ' ' < "build/macos-check/$mode.log")"
          done

      - name: Upload the start check (screenshot, logs)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: VoiceType.Uno-macos-check
          path: |
            build/macos-check/*.png
            build/macos-check/*.log
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}

  # ------------------------------------------------------------------------------------------------
  # iOS head (net10.0-ios, Skia on UIKit). Two unsigned builds of the same project on a Mac runner:
  #   simulator - iossimulator-arm64, runs in the Xcode Simulator on an Apple-silicon Mac
  #   device    - ios-arm64, the Release/AOT/linker pass for a real iPhone; unsigned, so it cannot be installed
  # A device install needs the Apple Developer account steps at the end of this job (docs/ci.md, iOS).
  # The head is opt-in in the csproj (-p:UnoIosOnly=true, built with -f net10.0-ios).
  # ------------------------------------------------------------------------------------------------
  ios:
    name: Build iOS (${{ matrix.name }}, unsigned)
    if: ${{ inputs.ios }}
    # macos-26 = macOS 26 arm64 with Xcode 26.0.1 ... 26.6 (default 26.6) and .NET SDK 10.0.401.
    # macos-latest is the same image today; pin the label so Xcode does not move under the workload.
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simulator
            rid: iossimulator-arm64
            artifact: VoiceType.Uno-ios-simulator
          - name: device
            rid: ios-arm64
            artifact: VoiceType.Uno-ios-device-unsigned

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build (.NET 10 SDK, NuGet cache, LiteRtLmSharp feed)
        uses: ./.github/actions/setup-build

      # The workload version and the Xcode move TOGETHER, and the Xcode is not always the first two parts of the workload
      # version: 26.5.10318 needs Xcode 26.6 ("This version of .NET for iOS (26.5.10318) requires Xcode 26.6").
      # The unpinned `dotnet workload install ios` takes the newest manifest (27.x today), whose Xcode is not on the
      # runner image. Change both values together after reading the build error of the new combination.
      - name: Install iOS workload (pinned)
        shell: bash
        env:
          IOS_WORKLOAD: 26.5.10318/10.0.100
        run: |
          printf '{ "microsoft.net.sdk.ios": "%s" }\n' "$IOS_WORKLOAD" > "$RUNNER_TEMP/ios-rollback.json"
          dotnet workload install ios --from-rollback-file "$RUNNER_TEMP/ios-rollback.json"
          dotnet workload list

      - name: Select the Xcode the workload requires
        shell: bash
        env:
          IOS_XCODE: '26.6'
        run: |
          app="/Applications/Xcode_${IOS_XCODE}.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::Xcode $IOS_XCODE is not on the runner image. Installed: $(find /Applications -maxdepth 1 -name 'Xcode_*.app' | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Build VoiceType.Uno (net10.0-ios, ${{ matrix.rid }}, no signing)
        # Use -f, never -p:TargetFrameworks: that global property leaks into every referenced library.
        shell: bash
        run: |
          set -o pipefail
          dotnet build ${{ env.UNO_PROJECT }} \
            -c Release -f net10.0-ios -r ${{ matrix.rid }} \
            -p:UnoIosOnly=true -p:EnableCodeSigning=false \
            -p:ApplicationDisplayVersion=${{ inputs.version }} -p:ApplicationVersion=${{ inputs.version-code }} \
            2>&1 | tee ios-build.log

      - name: Show the build errors
        # Hosted-runner logs need a login to read; the first distinct errors are repeated as annotations.
        if: ${{ failure() }}
        shell: bash
        run: |
          grep -E ' error |error :|: error|ILLink.*error|Undefined symbols|ld: ' ios-build.log | sort -u | head -n 25 |
            while IFS= read -r line; do echo "::error::${line:0:900}"; done

      - name: Zip the .app
        shell: bash
        run: |
          app=$(find apps/VoiceType.Uno/src/VoiceType.Uno/bin/Release/net10.0-ios -maxdepth 3 -name '*.app' | head -n 1)
          test -n "$app" || { echo "::error::no .app in the build output"; exit 1; }
          echo "app: $app"; du -sh "$app"
          mkdir -p build
          ditto -c -k --keepParent "$app" "build/${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      # ---- Signed IPA / TestFlight: disabled until the secrets exist (names listed in docs/ci.md) ----
      # - name: Import the signing certificate and provisioning profile
      #   env:
      #     P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      #     P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      #     PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      #   run: |
      #     keychain="$RUNNER_TEMP/build.keychain"; pass="$(uuidgen)"
      #     security create-keychain -p "$pass" "$keychain"
