name: VoiceType.Uno CI

run-name: VoiceType.Uno CI · ${{ github.ref_name }} · #${{ github.run_number }}

# Platform packages of every master push and of pull requests that touch the app (the build + unit tests are in ci.yml).
# The jobs themselves live in uno-publish.yml. Pull requests build Windows + Linux only; Android (~15 min) and macOS
# (a Mac runner) run on master pushes and on demand. iOS has its own workflow (build-voicetype-uno-ios.yml).

on:
  workflow_dispatch:
    inputs:
      android:
        description: Build the Android AAB + APK
        type: boolean
        default: true
      macos:
        description: Build VoiceType.app for macOS (Apple silicon)
        type: boolean
        default: true
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-voicetype-uno.yml'
      - '.github/workflows/uno-publish.yml'
      - '.github/actions/**'
      - 'apps/VoiceType.Uno/**'
      - 'libraries/SpeechLib/**'
      - 'libraries/VoiceType.Hotkeys/**'
      - 'tools/scripts/fetch-litertlmsharp-feed.ps1'
      - 'tools/scripts/x11-window-fixer.py'
      - 'nuget.config'
      - 'global.json'
  pull_request:
    paths:
      - '.github/workflows/build-voicetype-uno.yml'
      - '.github/workflows/uno-publish.yml'
      - '.github/actions/**'
      - 'apps/VoiceType.Uno/**'
      - 'libraries/SpeechLib/**'
      - 'libraries/VoiceType.Hotkeys/**'
      - 'tools/scripts/fetch-litertlmsharp-feed.ps1'
      - 'tools/scripts/x11-window-fixer.py'
      - 'nuget.config'
      - 'global.json'

concurrency:
  group: uno-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publish:
    name: Platform packages
    uses: ./.github/workflows/uno-publish.yml
    with:
      version: 1.0.${{ github.run_number }}
      version-code: ${{ fromJSON(github.run_number) }}
      # Not `inputs.android != false`: on a push `inputs.android` is null and `null != false` is false in a workflow
      # expression, which would silently switch the master Android build off.
      android: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.android) }}
      macos: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.macos) }}
      retention-days: 7
    # No secrets are needed for a CI package: without the keystore the APK is debug-signed (and says so).
    secrets: inherit
