name: VoiceType.Uno Android Release

run-name: VoiceType.Uno Android · ${{ github.ref_name }}

# Tag uno-android-vX.Y.Z -> Android AAB + APK only (hotfix of the phone build without touching the desktop packages).
# Manual runs build the packages and keep them as workflow artifacts; only a tag creates a release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'uno-android-v*'

permissions:
  contents: read

jobs:
  meta:
    name: Version from the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$IS_TAG" != 'true' ]]; then
            {
              echo "version=1.0.$RUN_NUMBER"
              echo "code=$RUN_NUMBER"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${REF_NAME#uno-android-v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::tag '$REF_NAME' is not uno-android-vMAJOR.MINOR.PATCH"; exit 1; }
          code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          {
            echo "version=$version"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Android package
    needs: meta
    uses: ./.github/workflows/uno-publish.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      version-code: ${{ fromJSON(needs.meta.outputs.code) }}
      windows: false
      linux: false
      android: true
      require-android-signing: false
      retention-days: 3
    secrets: inherit

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: VoiceType.Uno-android
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*-Signed.aab
            release-assets/*-Signed.apk
