name: Convert Parakeet TDT to ONNX

run-name: Parakeet TDT ONNX · ${{ github.ref_name }}

# Manual trigger only — conversion is experimental and downloads a 0.6B model.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MODEL: nvidia/parakeet-tdt-0.6b-v3

jobs:
  convert:
    name: Export ONNX (FP32 + INT4) and upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.10 (NeMo 2.4 supported range)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "nemo_toolkit[asr]>=2.4" onnx onnxruntime sentencepiece huggingface_hub

      - name: Export encoder (FP32 + INT4) and TDT decoder
        run: |
          python tools/converters/ParakeetTdt/export_onnx.py \
            --model "$MODEL" \
            --out build/parakeet-tdt-onnx

      - name: List artifacts
        run: |
          ls -la build/parakeet-tdt-onnx
          du -sh build/parakeet-tdt-onnx

      - name: Upload artifacts (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: parakeet-tdt-onnx
          path: build/parakeet-tdt-onnx
          if-no-files-found: error

      - name: Upload to HuggingFace
        if: env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install "huggingface_hub[cli]"
          hf repo create DimQ1/parakeet-tdt-0.6b-v3-onnx --type model --yes || true
          hf upload DimQ1/parakeet-tdt-0.6b-v3-onnx build/parakeet-tdt-onnx \
            --commit-message "Add parakeet-tdt-0.6b-v3 ONNX (FP32 encoder + INT4 encoder)"
