<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon background (Uno.Resizetizer UnoIcon). The microphone is the foreground
     layer (icon_foreground.svg): Android draws it as an adaptive icon over this
     background, the other heads composite both layers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 456" width="456" height="456">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E4FD8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="440" height="440" rx="88" ry="88" fill="url(#bg)"/>
</svg>
