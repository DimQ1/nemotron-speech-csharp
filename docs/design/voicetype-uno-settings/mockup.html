<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoiceType Settings mockup</title>
<!--
  VoiceType.Uno — Settings mockup (phone, tablet, desktop). See README.md in this folder.

  Settings is a page, not a ContentDialog:
    < 840 px   hub list of sections → section page (Back returns to the hub)
    >= 840 px  two panes: section list 300 px on the left, section page (<= 720 px) on the right

  Query parameters (all optional):
    page=hub|storage|speech|audio|translation|typing|hotkeys|general
                 hub = the section list (on wide windows it shows storage on the right)
    os=android   Android head: no desktop-only sections (typing, hotkeys, window), folders are read-only
    sheet=move   the question after the system folder picker ("Move … to the new folder?")
    kind=models|recordings|data    which folder the sheet / state is about (default models)
    drive=same|other|nested        sheet=move: new folder on the same drive (Move on restart),
                                   another drive (no automatic copy), or inside the current folder
    state=pending|incomplete       pending = a move waits for the restart (PendingModelsRoot),
                                   incomplete = the start-up move could not finish (ModelStorageNote)
    rec=1        hotkeys: the first shortcut field is recording keys; conflict=1 a shortcut is taken
    srv=1        translation: "Local server" engine chosen
    adv=1        speech: advanced section expanded
    top/bottom/left/right=<px>  system bar insets   kb=<px>  on-screen keyboard height
    theme=light|dark   check=1  run the layout check, report JSON into #check

  Layout check — for every interactive element ([data-hit]) of the top-most layer:
    1. inside the safe viewport (inside a scroll pane: the pane must be inside it),
    2. hit target >= 44x44 px,
    3. no intersection with another interactive element (visible part in scroll panes),
    4. its label is not clipped (scrollWidth <= clientWidth),
    5. folder paths are never clipped: every .path box shows the whole path (wraps, no ellipsis),
    6. the section page keeps a reading area >= 96 px (>= 72 px on short landscape windows).
-->
<style>
  :root {
    --bg: #f3f3f3; --surface: #ffffff; --surface-2: #f9f9f9; --stroke: #e0e0e0;
    --text: #1b1b1b; --text-2: #5f5f5f; --accent: #005fb8; --accent-text: #ffffff;
    --caution-bg: #fff4ce; --caution: #9d5d00; --danger: #c42b1c; --ok: #0f7b0f;
    --info-bg: #dbe9f8; --scrim: rgba(0, 0, 0, .4); --chip-on: #dbe9f8;
    --seg-models: #005fb8; --seg-rec: #8764b8; --seg-data: #00a2ad; --seg-free: #e0e0e0;
    --shadow: 0 8px 24px rgba(0,0,0,.18); --mono: "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #202020; --surface: #2b2b2b; --surface-2: #323232; --stroke: #3d3d3d;
      --text: #ffffff; --text-2: #c5c5c5; --accent: #60cdff; --accent-text: #000000;
      --caution-bg: #433519; --caution: #fce100; --danger: #ff99a4; --ok: #6ccb5f;
      --info-bg: #1f3a52; --chip-on: #1f3a52;
      --seg-models: #60cdff; --seg-rec: #b69ce0; --seg-data: #4fd1d9; --seg-free: #3d3d3d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #202020; --surface: #2b2b2b; --surface-2: #323232; --stroke: #3d3d3d;
    --text: #ffffff; --text-2: #c5c5c5; --accent: #60cdff; --accent-text: #000000;
    --caution-bg: #433519; --caution: #fce100; --danger: #ff99a4; --ok: #6ccb5f;
    --info-bg: #1f3a52; --chip-on: #1f3a52;
    --seg-models: #60cdff; --seg-rec: #b69ce0; --seg-data: #4fd1d9; --seg-free: #3d3d3d;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text);
         font: 14px/20px "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7;
        stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* System bars (simulated) */
  .sysbar { position: fixed; z-index: 60; background: rgba(0,0,0,.08); pointer-events: none; }
  .sysbar.top { left: 0; right: 0; top: 0; height: var(--inset-top); }
  .sysbar.bottom { left: 0; right: 0; bottom: 0; height: var(--inset-bottom); }
  .sysbar.right { top: 0; bottom: 0; right: 0; width: var(--inset-right); }
  .sysbar.left { top: 0; bottom: 0; left: 0; width: var(--inset-left); }
  .keyboard { position: fixed; z-index: 59; left: 0; right: 0; bottom: 0; height: var(--kb); display: none;
              background: repeating-linear-gradient(90deg, #cfd3d8 0 34px, #c3c7cc 34px 36px); }
  body.is-kb .keyboard { display: block; }

  /* ── Page: SafeArea grid, app bar + body ── */
  .page { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr;
          padding: var(--inset-top) var(--inset-right) max(var(--inset-bottom), var(--kb)) var(--inset-left); }
  .appbar { display: grid; grid-template-columns: 48px 1fr; align-items: center; gap: 8px;
            min-height: 56px; padding: 4px 8px 4px 4px; }
  .appbar h1 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; }
  .appbar p { margin: 0; font-size: 12px; line-height: 16px; color: var(--text-2);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 48px; height: 48px; border: 0; border-radius: 8px; background: transparent;
              display: inline-grid; place-items: center; cursor: pointer; }
  .icon-btn:hover { background: var(--surface-2); }

  .body { min-height: 0; display: grid; grid-template-columns: 1fr; }
  .nav, .pane { min-height: 0; overflow: auto; }
  body:not(.is-hub) .nav { display: none; }
  body.is-hub .pane { display: none; }
  /* Wide: list on the left, page on the right; the hub never hides the page */
  @media (min-width: 840px) {
    .body { grid-template-columns: 300px 1fr; }
    body.is-hub .nav, body:not(.is-hub) .nav { display: block; border-right: 1px solid var(--stroke); }
    body.is-hub .pane { display: block; }
  }
  .nav { padding: 0 8px 16px; }
  .nav h2 { margin: 16px 12px 4px; font-size: 12px; font-weight: 600; color: var(--text-2);
            text-transform: uppercase; letter-spacing: .04em; }
  .nav-item { width: 100%; min-height: 56px; display: grid; grid-template-columns: 24px 1fr 20px; gap: 12px;
              align-items: center; padding: 6px 12px; border: 0; border-radius: 8px; background: transparent;
              text-align: left; cursor: pointer; position: relative; }
  .nav-item small { display: block; font-size: 12px; line-height: 16px; color: var(--text-2);
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item span { min-width: 0; }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item .chev { color: var(--text-2); }
  @media (min-width: 840px) {
    .nav-item .chev { visibility: hidden; }
    .nav-item.on { background: var(--surface); }
    .nav-item.on::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px;
                           border-radius: 2px; background: var(--accent); }
    .nav-item.ext .chev { visibility: visible; }
  }
  .pane { padding: 0 16px 24px; }
  .inner { max-width: 720px; margin: 0 auto; }
  @media (min-width: 840px) { .pane { padding: 0 24px 24px; } .pane-title { display: block !important; } }
  .pane-title { display: none; margin: 12px 4px 4px; font-size: 20px; font-weight: 600; line-height: 28px; }

  /* Groups and rows (same anatomy as Settings › History) */
  .sec { margin: 16px 4px 6px; font-size: 12px; font-weight: 600; color: var(--text-2);
         text-transform: uppercase; letter-spacing: .04em; }
  .group { background: var(--surface); border: 1px solid var(--stroke); border-radius: 8px; overflow: hidden; }
  .group + .group { margin-top: 8px; }
  .row { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center;
         min-height: 56px; padding: 6px 12px; }
  .row + .row, .row + .opt, .opt + .row { border-top: 1px solid var(--stroke); }
  .row > span { min-width: 0; }
  .row small, .opt small { display: block; font-size: 12px; line-height: 16px; color: var(--text-2); }
  .row.link { width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; }
  .row.link:hover { background: var(--surface-2); }
  .row .chev { color: var(--text-2); }
  .row.stack { grid-template-columns: 24px 1fr; }
  .row.stack > .full { grid-column: 2; }
  .note { margin: 8px 4px 0; font-size: 12px; line-height: 16px; color: var(--text-2); }

  .switch { width: 48px; height: 48px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .switch i { width: 40px; height: 20px; border-radius: 10px; border: 1px solid var(--text-2); position: relative; display: block; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--text-2); }
  .switch.on i { background: var(--accent); border-color: var(--accent); }
  .switch.on i::after { left: 22px; background: var(--accent-text); }
  .select { min-height: 44px; min-width: 112px; max-width: 220px; display: inline-flex; align-items: center; justify-content: space-between;
            gap: 8px; padding: 0 10px 0 12px; border: 1px solid var(--stroke); border-radius: 6px; background: var(--surface-2);
            cursor: pointer; white-space: nowrap; }
  .select svg { width: 16px; height: 16px; color: var(--text-2); }
  .btn { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--stroke);
         background: var(--surface-2); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn.accent { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btn.accent[disabled] { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn svg { width: 16px; height: 16px; }
  .field { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--stroke); border-radius: 6px;
           background: var(--surface-2); }
  .field.mono { font-family: var(--mono); font-size: 13px; }
  .field.focus { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .field.bad { border-color: var(--danger); box-shadow: inset 0 -2px 0 var(--danger); }
  textarea.field { min-height: 88px; resize: none; line-height: 20px; }

  /* Options (radio list) */
  .opt { width: 100%; min-height: 56px; display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: center;
         padding: 6px 12px; border: 0; background: transparent; text-align: left; cursor: pointer; }
  .opt + .opt { border-top: 1px solid var(--stroke); }
  .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--text-2); }
  .opt.on .radio { border: 6px solid var(--accent); }
  .opt[aria-disabled="true"] { opacity: .5; }
  .tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px; font-size: 11px; line-height: 16px;
         background: var(--chip-on); color: var(--text); vertical-align: 1px; }

  /* Segmented */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; border-radius: 8px;
         background: var(--surface-2); border: 1px solid var(--stroke); }
  .seg button { min-height: 44px; min-width: 44px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
  .seg button.on { background: var(--surface); font-weight: 600; box-shadow: 0 0 0 1px var(--stroke); }

  /* Key chips (hotkeys) */
  .keys { min-height: 44px; min-width: 132px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px;
          padding: 0 8px; border: 1px solid var(--stroke); border-radius: 6px; background: var(--surface-2); cursor: pointer; }
  .keys kbd { font: 12px/18px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--stroke);
              border-bottom-width: 2px; background: var(--surface); }
  .keys.rec { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); color: var(--text-2); font-size: 12px; }
  .keys.bad { border-color: var(--caution); }

  /* ── Storage ── */
  .usage { padding: 12px; }
  .usage .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--seg-free); margin: 8px 0 10px; }
  .usage .bar i { display: block; height: 100%; }
  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 12px; font-size: 12px; color: var(--text-2); }
  .legend b { color: var(--text); font-weight: 600; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .loc { padding: 12px; display: grid; gap: 8px; }
  .loc-head { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: start; }
  .loc-head b { font-weight: 600; }
  .loc-head small { display: block; font-size: 12px; line-height: 16px; color: var(--text-2); }
  .badge { font-size: 11px; line-height: 18px; padding: 0 8px; border-radius: 9px; border: 1px solid var(--stroke); color: var(--text-2); white-space: nowrap; }
  .badge.custom { background: var(--info-bg); border-color: transparent; color: var(--text); }
  .badge.bad { background: var(--caution-bg); border-color: var(--caution); color: var(--text); }
  .path { font: 13px/18px var(--mono); padding: 8px 10px; border-radius: 6px; background: var(--surface-2);
          border: 1px solid var(--stroke); overflow-wrap: anywhere; word-break: break-all; user-select: text; }
  .path.dim { color: var(--text-2); text-decoration: line-through; }
  .facts { font-size: 12px; line-height: 16px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .facts b { color: var(--text); font-weight: 600; }
  .inside { font-size: 12px; line-height: 18px; color: var(--text-2); display: grid; grid-template-columns: auto 1fr; gap: 0 12px; }
  .inside code { font-family: var(--mono); color: var(--text); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions.two { display: grid; grid-template-columns: 1fr 1fr; }
  .actions.two .btn { justify-content: center; white-space: normal; text-align: center; }
  .caption { font-size: 11px; line-height: 14px; color: var(--text-2); margin-bottom: -4px; }
  .kinds { display: grid; grid-template-columns: auto auto 1fr; gap: 2px 10px; font-size: 13px; line-height: 20px; align-items: baseline; }
  .kinds code { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
  .kinds .none { color: var(--text-2); }
  .kinds > span:nth-child(3n) { text-align: right; white-space: nowrap; }
  .total { font-size: 12px; font-weight: 600; }
  @media (max-width: 359px) { .kinds { grid-template-columns: 1fr auto; } .kinds code { display: none; } }
  .loc .sub { margin: 0 -12px -12px; }
  .loc .sub .row { border-top: 1px solid var(--stroke); }
  .progress { display: grid; gap: 6px; font-size: 12px; color: var(--text-2); }
  .progress .track { height: 4px; border-radius: 2px; background: var(--stroke); overflow: hidden; }
  .progress .track i { display: block; height: 100%; width: 36%; background: var(--accent); }
  .callout { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 18px; }
  .callout.warn { background: var(--caution-bg); border: 1px solid var(--caution); }
  .callout.info { background: var(--info-bg); }
  .callout .actions { margin-top: 8px; }
  .callout b { font-weight: 600; }
  .callout + .group, .callout + .sec { margin-top: 8px; }

  /* ── Sheet: bottom sheet on phones, dialog on wide or short windows ── */
  .scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: none; }
  .sheet { position: fixed; z-index: 41; left: var(--inset-left); right: var(--inset-right); bottom: max(var(--inset-bottom), var(--kb));
           max-height: calc(100% - var(--inset-top) - max(var(--inset-bottom), var(--kb)) - 24px);
           background: var(--surface); border-radius: 12px 12px 0 0; box-shadow: var(--shadow); display: none;
           grid-template-rows: auto 1fr auto; }
  body.is-sheet .scrim { display: block; } body.is-sheet .sheet { display: grid; }
  @media (min-width: 840px), (max-height: 479px) {
    .sheet { left: 50%; right: auto; width: min(520px, calc(100% - var(--inset-left) - var(--inset-right) - 32px));
             transform: translateX(-50%); top: calc(var(--inset-top) + 16px); bottom: auto;
             max-height: calc(100% - var(--inset-top) - max(var(--inset-bottom), var(--kb)) - 32px); border-radius: 12px; }
  }
  .s-head { padding: 12px 8px 4px 16px; display: grid; grid-template-columns: 1fr 48px; align-items: center; gap: 8px; }
  .s-head b { font-size: 16px; line-height: 22px; }
  .s-head small { display: block; font-size: 12px; color: var(--text-2); line-height: 16px; }
  .s-body { min-height: 0; overflow: auto; padding: 4px 16px 8px; display: grid; gap: 8px; align-content: start; }
  .s-body h4 { margin: 8px 0 0; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .s-body .opt { padding: 6px 4px; }
  .s-body .group .opt { padding: 6px 12px; }
  .s-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 16px 12px; border-top: 1px solid var(--stroke); }
  .pick { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .valid { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 12px; line-height: 16px; }
  .valid svg { width: 18px; height: 18px; }
  .valid.ok { color: var(--ok); } .valid.err { color: var(--danger); }
  .valid span { color: var(--text); }
  @media (max-height: 479px) { .s-head { padding-top: 4px; } .s-foot { padding: 4px 16px 6px; } }

  #check { display: none; }
</style>
</head>
<body>
<div class="sysbar top"></div><div class="sysbar bottom"></div><div class="sysbar left"></div><div class="sysbar right"></div>
<div class="keyboard"></div>

<div class="page">
  <header class="appbar">
    <button class="icon-btn" data-hit="back" aria-label="Back" id="back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div><h1 id="title">Settings</h1><p id="subtitle"></p></div>
  </header>
  <div class="body">
    <nav class="nav" id="nav" aria-label="Settings sections"></nav>
    <main class="pane" id="pane"><div class="inner" id="inner"></div></main>
  </div>
</div>

<div class="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<pre id="check"></pre>

<script>
  const S = Object.fromEntries(new URLSearchParams(location.search));
  const has = k => S[k] === '1';
  const cls = document.body.classList;
  const root = document.documentElement.style;
  if (S.theme) document.documentElement.dataset.theme = S.theme;
  for (const k of ['top', 'bottom', 'left', 'right']) root.setProperty(`--inset-${k}`, (S[k] || 0) + 'px');
  root.setProperty('--kb', (S.kb || 0) + 'px');
  if (S.kb) cls.add('is-kb');

  const android = S.os === 'android';
  const wide = innerWidth >= 840;
  let page = S.page || 'hub';
  if (page === 'hub') cls.add('is-hub');
  // Wide windows always show a section on the right; the hub selects Storage.
  const shown = page === 'hub' ? 'storage' : page;
  const kind = S.kind || 'models';
  const state = S.state || '';

  const go = p => { const q = new URLSearchParams(location.search); for (const [k, v] of Object.entries(p)) { if (v === null) q.delete(k); else q.set(k, v); } location.search = q.toString(); };

  const I = {
    storage: '<path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
    speech: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    audio: '<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/>',
    translation: '<path d="M4 5h9M8.5 3v2M6 5c1 4 4 7 7 8M11 5c-1 4-4 7-7 8M13 21l4-10 4 10M14.5 17h5"/>',
    typing: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h1M11 10h1M15 10h2M7 14h10"/>',
    hotkeys: '<path d="M8 4h8M12 4v4M5 10h14l-1 10H6z"/><path d="M10 14h4"/>',
    general: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
    history: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    models: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>',
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    data: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/>',
    rec: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
    chev: '<path d="M9 6l6 6-6 6"/>', down: '<path d="M6 9l6 6 6-6"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',

  // ── Assemble ────────────────────────────────────────────────────────────────
  document.getElementById('title').textContent = page === 'hub' && !wide ? 'Settings' : (wide ? 'Settings' : titleOf(page));

  // ── Layout check ────────────────────────────────────────────────────────────
  function check() {
    const vw = innerWidth, vh = innerHeight;
    const n = k => parseInt(S[k] || '0', 10) || 0;
    const safe = { l: n('left'), t: n('top'), r: vw - n('right'), b: vh - Math.max(n('bottom'), n('kb')) };
    const short = vh < 480;
    const visible = el => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
    const active = cls.contains('is-sheet') ? 'sheet' : 'page';
    const layerOf = el => el.closest('.sheet') ? 'sheet' : 'page';
    const els = [...document.querySelectorAll('[data-hit]')].filter(visible).filter(el => layerOf(el) === active);
    const issues = [];
    const scrollParent = el => { for (let p = el.parentElement; p; p = p.parentElement) { const s = getComputedStyle(p).overflowY; if ((s === 'auto' || s === 'scroll') && p.scrollHeight > p.clientHeight) return p; } return null; };
    const clip = (r, el) => { const sp = scrollParent(el); if (!sp) return r; const c = sp.getBoundingClientRect();
      const l = Math.max(r.left, c.left), t = Math.max(r.top, c.top), rr = Math.min(r.right, c.right), b = Math.min(r.bottom, c.bottom);
      return { left: l, top: t, right: Math.max(l, rr), bottom: Math.max(t, b) }; };
    const rects = els.map(el => ({ id: el.dataset.hit, r: el.getBoundingClientRect(), v: clip(el.getBoundingClientRect(), el), el }));
    const tol = 0.5;
    for (const { id, r, el } of rects) {
      const sp = scrollParent(el);
      const box = sp ? sp.getBoundingClientRect() : r;
      if (!sp && (r.left < safe.l - tol || r.top < safe.t - tol || r.right > safe.r + tol || r.bottom > safe.b + tol))
        issues.push(`${id}: outside safe area [${r.left|0},${r.top|0},${r.right|0},${r.bottom|0}] vs [${safe.l},${safe.t},${safe.r},${safe.b}]`);
      if (sp && (box.left < safe.l - tol || box.top < safe.t - tol || box.right > safe.r + tol || box.bottom > safe.b + tol))
        issues.push(`${id}: scroll container outside safe area`);
      if (sp && (r.left < box.left - tol || r.right > box.right + tol)) issues.push(`${id}: wider than its scroll pane`);
      if (r.width < 44 - tol || r.height < 44 - tol) issues.push(`${id}: hit target ${r.width.toFixed(0)}x${r.height.toFixed(0)} < 44x44`);
      if (el.tagName !== 'TEXTAREA' && el.tagName !== 'INPUT' && el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflow !== 'visible')
        issues.push(`${id}: label clipped (${el.scrollWidth} > ${el.clientWidth})`);
    }
    for (let i = 0; i < rects.length; i++)
      for (let j = i + 1; j < rects.length; j++) {
        const a = rects[i].v, c = rects[j].v;
        const ox = Math.min(a.right, c.right) - Math.max(a.left, c.left);
        const oy = Math.min(a.bottom, c.bottom) - Math.max(a.top, c.top);
        if (ox > 0.5 && oy > 0.5) issues.push(`${rects[i].id} overlaps ${rects[j].id} (${ox.toFixed(0)}x${oy.toFixed(0)})`);
      }
    // Paths are the point of the Storage page: never cut, never wider than their card.
    for (const p of document.querySelectorAll('.path')) if (visible(p)) {
      if (p.scrollWidth > p.clientWidth + 1) issues.push(`path clipped (${p.textContent.slice(0, 32)}…)`);
      const card = p.closest('.group, .sheet, .callout');
      if (card && p.getBoundingClientRect().right > card.getBoundingClientRect().right + tol) issues.push('path wider than its card');
    }
    if (active === 'page') {
      const minRead = short ? 72 : 96;
      for (const sel of ['.pane', '.nav']) { const e = document.querySelector(sel);
        if (e && visible(e)) { const h = e.getBoundingClientRect().height; if (h < minRead - tol) issues.push(`${sel}: reading area ${h.toFixed(0)} px < ${minRead}`); } }
    }
    return { viewport: `${vw}x${vh}`, safe, layer: active, checked: rects.map(x => x.id), issues, ok: issues.length === 0 };
  }
  if (S.check === '1') {
    const report = JSON.stringify(check());
    document.getElementById('check').textContent = report;
    if (parent !== window) parent.postMessage(report, '*');
  }
</script>
</body>
</html>
