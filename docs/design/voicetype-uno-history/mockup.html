<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoiceType History mockup</title>
<!--
  VoiceType.Uno — recordings history mockup (mobile + desktop).
  Same visual language, tokens and layout rules as ../voicetype-uno-mobile/mockup.html.

  Layers (top-most is interactive):  sheet/dialog  >  drawer  >  page (History, Chats, Queue, Settings)  >  main screen

  Query parameters (all optional):
    screen=main|history|detail|chats|chat|queue|settings   which page is shown (default main)
    snack=1      main screen: "Saved to History" snackbar after Stop
    drawer=1     side menu open (main screen)
    tab=transcript|chats|translation|versions   Recording detail tab (no per-recording chat tab any more)
    edit=1       Transcript tab in edit mode (saving creates an "edited" version)
    playing=1    player is playing (current segment highlighted)
    chat=empty|thread|streaming   top-level chat (screen=chat): empty = just created by "Ask Gemma"
    trp=1        translation in progress            rr=1  re-recognition running
    diff=1       Versions tab: compare view          noaudio=1  audio removed by retention
    sel=1        History: selection mode             q=<text>   History search text
    screen=models  Models page, Speakers tab (Nemotron 3 Diarization, ONNX variants)
    live=1       main screen recording with live speaker labels   live=2  live labels fell behind (fallback)
    spk=1        the recording has speakers (diarization layer)   fspk=1  transcript filtered to one speaker
    rp=1         Versions: a reprocess chain is running           ins=1   Chats tab: Insights from the analysis step
    chain=1      Queue: a reprocess chain runs + auto-reprocess is scheduled
    merge=1      Speakers sheet in merge mode
    sheet=rerun|filter|batch|delete|rename|export|addsrc|sources|addto|speakers|reprocess   (exp=chat: export a chat as Markdown)
                 modal sheet (bottom sheet on phones, dialog on wide/short windows);
                 delete is a centred confirmation dialog on every size
    top/bottom/left/right=<px>  system bar insets   kb=<px>  on-screen keyboard height
    theme=light|dark   check=1  run the layout check, report JSON into #check

  Layout check — for every interactive element ([data-hit]) of the top-most layer:
    1. fully inside the safe viewport (scrollable panes: the pane must be inside it),
    2. hit target >= 44x44 px,
    3. no intersection with another interactive element (visible part in scroll panes),
    4. its label is not clipped (scrollWidth <= clientWidth),
    5. centring: Record on the main screen, Play inside the player bar (|dx| <= 1 px),
    6. reading areas (transcript / chat / lists / diff / queue / settings) keep >= 96 px height
       (>= 72 px on short landscape windows),
    7. the main-screen snackbar does not overlap the command bar.
-->
<style>
  :root {
    --bg: #f3f3f3; --surface: #ffffff; --surface-2: #f9f9f9; --stroke: #e0e0e0;
    --text: #1b1b1b; --text-2: #5f5f5f; --accent: #005fb8; --accent-text: #ffffff;
    --rec: #c42b1c; --rec-ring: rgba(196, 43, 28, .25);
    --caution-bg: #fff4ce; --caution: #9d5d00; --scrim: rgba(0, 0, 0, .4);
    --chip-on: #dbe9f8; --ins: #dff6dd; --ins-text: #0f5c0f; --del: #fde7e9; --del-text: #a4262c;
    --shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #202020; --surface: #2b2b2b; --surface-2: #323232; --stroke: #3d3d3d;
      --text: #ffffff; --text-2: #c5c5c5; --accent: #60cdff; --accent-text: #000000;
      --rec: #ff99a4; --rec-ring: rgba(255, 153, 164, .25);
      --caution-bg: #433519; --caution: #fce100; --chip-on: #1f3a52;
      --ins: #1e3b1e; --ins-text: #9fd89f; --del: #442726; --del-text: #ff99a4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #202020; --surface: #2b2b2b; --surface-2: #323232; --stroke: #3d3d3d;
    --text: #ffffff; --text-2: #c5c5c5; --accent: #60cdff; --accent-text: #000000;
    --rec: #ff99a4; --rec-ring: rgba(255, 153, 164, .25);
    --caution-bg: #433519; --caution: #fce100; --chip-on: #1f3a52;
    --ins: #1e3b1e; --ins-text: #9fd89f; --del: #442726; --del-text: #ff99a4;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text);
         font: 14px/20px "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7;
        stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* System bars + keyboard (simulated) */
  .sysbar { position: fixed; z-index: 60; background: rgba(0,0,0,.08); pointer-events: none; }
  .sysbar.top { left: 0; right: 0; top: 0; height: var(--inset-top); }
  .sysbar.bottom { left: 0; right: 0; bottom: 0; height: var(--inset-bottom); }
  .sysbar.right { top: 0; bottom: 0; right: 0; width: var(--inset-right); }
  .sysbar.left { top: 0; bottom: 0; left: 0; width: var(--inset-left); }
  .keyboard { position: fixed; z-index: 59; left: 0; right: 0; bottom: 0; height: var(--kb);
              background: repeating-linear-gradient(90deg, #cfd3d8 0 34px, #c3c7cc 34px 36px); display: none; }
  body.is-kb .keyboard { display: block; }

  /* Shared bits (identical to the sibling mockup) */
  .appbar { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 8px;
            min-height: 56px; padding: 4px 8px 4px 4px; }
  .icon-btn { width: 48px; height: 48px; border: 0; border-radius: 8px; background: transparent;
              display: inline-grid; place-items: center; cursor: pointer; position: relative; }
  .icon-btn:hover { background: var(--surface-2); }
  .title { min-width: 0; }
  .title h1 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title p { margin: 0; font-size: 12px; line-height: 16px; color: var(--text-2);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--stroke);
         background: var(--surface-2); cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .chip { font-size: 11px; line-height: 16px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--stroke); white-space: nowrap; }
  .chip.acc { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .chip.on { background: var(--chip-on); border-color: transparent; font-weight: 600; }
  .chip.warn { background: var(--caution-bg); border-color: var(--caution); color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .muted { color: var(--text-2); }
  .bar { height: 4px; border-radius: 2px; background: var(--stroke); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .seg-ctl { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); gap: 2px; padding: 2px;
             border-radius: 8px; background: var(--surface-2); border: 1px solid var(--stroke); }
  .seg-ctl button { min-height: 44px; border: 0; border-radius: 6px; background: transparent; cursor: pointer;
                    font-size: 13px; padding: 0 6px; white-space: nowrap; overflow: hidden; }
  .seg-ctl button.sel { background: var(--surface); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .switch { width: 40px; height: 20px; border-radius: 10px; border: 1px solid var(--text-2); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--text-2); }
  .on > .switch, .switch.on { background: var(--accent); border-color: var(--accent); }
  .on > .switch::after, .switch.on::after { left: 23px; background: var(--accent-text); }

  /* ════════ Main screen (only what the history entry points need) ════════ */
  .page { position: fixed; inset: 0;
          padding: var(--inset-top) var(--inset-right) max(var(--inset-bottom), var(--kb)) var(--inset-left);
          display: grid; grid-template-rows: auto 1fr auto auto; }
  .page > .appbar { grid-row: 1; } .page > .content { grid-row: 2; } .page > .snack-row { grid-row: 3; } .page > .cmdbar { grid-row: 4; }
  .state-pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px;
                background: var(--surface); border: 1px solid var(--stroke); font-size: 12px; white-space: nowrap; }
  .state-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-2); }
  .content { min-height: 0; padding: 8px 16px; display: grid; }
  .card { min-height: 0; display: grid; grid-template-rows: auto 1fr; border-radius: 8px;
          background: var(--surface); border: 1px solid var(--stroke); overflow: hidden; }
  .card > header { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 4px 0 12px;
                   font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--stroke); }
  .card > header .sp { flex: 1; }
  .card > header .icon-btn { width: 44px; height: 44px; }
  .card .body { overflow: auto; padding: 12px; font-size: 15px; line-height: 22px; }
  /* Snackbar: its own grid row above the command bar, so it never covers Record/Mute/Copy */
  .snack-row { padding: 0 16px 4px; }
  .snack { display: grid; grid-template-columns: 24px 1fr auto auto; align-items: center; gap: 4px 8px;
           max-width: 560px; margin: 0 auto; padding: 2px 2px 2px 12px; border-radius: 8px;
           background: #323232; color: #fff; box-shadow: var(--shadow); }
  :root[data-theme="dark"] .snack { background: #e6e6e6; color: #1b1b1b; }
  .snack p { margin: 0; font-size: 13px; line-height: 18px; min-width: 0; }
  .snack p small { display: block; opacity: .75; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .snack .open { min-height: 44px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent;
                 color: #9fd3ff; font-weight: 600; cursor: pointer; }
  :root[data-theme="dark"] .snack .open { color: #005fb8; }
  .snack .x { width: 44px; height: 44px; border: 0; background: transparent; color: inherit; display: grid; place-items: center; cursor: pointer; }
  .cmdbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 24px;
            padding: 8px 16px 12px; background: var(--bg); }
  .cmdbar .left { justify-self: end; } .cmdbar .right { justify-self: start; }
  .round-btn { width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--stroke);
               background: var(--surface); display: grid; place-items: center; cursor: pointer; }
  .round-btn[disabled] { opacity: .4; }
  .record { width: 72px; height: 72px; border-radius: 36px; border: 0; cursor: pointer;
            background: var(--accent); color: var(--accent-text); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .record svg { width: 30px; height: 30px; }
  .record-wrap { display: grid; justify-items: center; gap: 4px; }
  .record-caption { font-size: 12px; line-height: 16px; color: var(--text-2); white-space: nowrap; }
  @media (max-height: 479px) {
    .appbar { min-height: 48px; padding-top: 0; padding-bottom: 0; }
    .cmdbar { padding: 4px 16px 8px; }
    .record { width: 56px; height: 56px; border-radius: 28px; }
    .record-caption { display: none; }
  }

  /* Drawer (copied from the sibling, plus the History entry) */
  .scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: none; }
  .drawer { position: fixed; z-index: 21; top: 0; bottom: 0; left: 0; width: min(320px, 85vw);
            padding: var(--inset-top) 0 var(--inset-bottom) var(--inset-left);
            background: var(--surface); box-shadow: var(--shadow); transform: translateX(-105%);
            display: grid; grid-template-rows: auto 1fr auto; }
  body.is-drawer .scrim { display: block; } body.is-drawer .drawer { transform: none; }
  .drawer .head { display: grid; grid-template-columns: 48px 1fr; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; min-height: 56px; }
  .drawer .scroll { overflow: auto; padding: 0 8px 8px; min-height: 0; }
  .drawer h2 { margin: 16px 12px 4px; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .item { width: 100%; min-height: 48px; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 12px;
          padding: 4px 12px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; }
  .item:hover { background: var(--surface-2); }
  .item small { display: block; font-size: 12px; line-height: 16px; color: var(--text-2); }
  .item.new { background: var(--chip-on); }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-text);
           font-size: 11px; line-height: 20px; text-align: center; }
  .drawer .foot { border-top: 1px solid var(--stroke); padding: 4px 8px; }

  /* ════════ History page: list pane + detail pane (master-detail >= 840 px) ════════ */
  .hist { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none;
          padding: var(--inset-top) var(--inset-right) max(var(--inset-bottom), var(--kb)) var(--inset-left);
          grid-template-columns: minmax(0,1fr); grid-template-rows: 1fr; }
  body.is-history .hist, body.is-detail .hist { display: grid; }
  .pane { min-width: 0; min-height: 0; display: grid; }
  .list-pane { grid-template-rows: auto auto auto 1fr; }
  .detail-pane { grid-template-rows: auto auto 1fr auto; background: var(--bg); }
  body.is-detail .list-pane { display: none; }
  body:not(.is-detail) .detail-pane { display: none; }
  @media (min-width: 840px) {
    .hist { grid-template-columns: 360px minmax(0,1fr); }
    body.is-detail .list-pane, body.is-history .list-pane { display: grid; }
    body.is-history .detail-pane, body.is-detail .detail-pane { display: grid; }
    .list-pane { border-right: 1px solid var(--stroke); }
    .detail-pane .back { visibility: hidden; }
  }
  /* Search row */
  .search-row { display: grid; grid-template-columns: 1fr 48px; gap: 4px; padding: 0 12px 8px 16px; align-items: center; }
  .search { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: center; min-height: 44px; padding: 0 12px;
            border-radius: 6px; border: 1px solid var(--stroke); background: var(--surface); }
  .search input { border: 0; outline: 0; background: transparent; min-width: 0; height: 40px; }
  body.is-kb .search { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .active-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
  .fchip { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 6px 0 12px; border-radius: 22px;
           border: 1px solid var(--stroke); background: var(--chip-on); cursor: pointer; font-size: 13px; }
  .fchip svg { width: 16px; height: 16px; }
  .dot-badge { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .list-scroll { min-height: 0; overflow: auto; padding: 0 8px 16px; }
  .group-h { margin: 12px 8px 4px; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .row { display: grid; grid-template-columns: 1fr 44px; align-items: center; border-radius: 8px; margin-bottom: 4px;
         background: var(--surface); border: 1px solid var(--stroke); }
  .row.sel-row { border-color: var(--accent); background: var(--chip-on); }
  .row.cur { border-color: var(--accent); }
  .row-main { display: grid; grid-template-columns: auto 1fr; gap: 10px; min-height: 76px; padding: 8px 4px 8px 12px; border: 0;
              background: transparent; text-align: left; cursor: pointer; min-width: 0; border-radius: 8px; }
  .row-main .lead { width: 36px; height: 36px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--stroke);
                    display: grid; place-items: center; align-self: center; font-size: 11px; color: var(--text-2); }
  .row-main .lead:not(.chk) { width: auto; min-width: 40px; height: 24px; padding: 0 6px; border-radius: 12px; font-variant-numeric: tabular-nums; }
  .row-main .lead.chk { border-radius: 4px; width: 22px; height: 22px; margin: 0 7px; }
  .row-main .lead.chk.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .row-main .txt { min-width: 0; display: grid; gap: 2px; }
  .row-main b { font-weight: 600; font-size: 14px; line-height: 19px; display: -webkit-box; -webkit-line-clamp: 2;
                -webkit-box-orient: vertical; overflow: hidden; }
  .row-main .meta { font-size: 12px; line-height: 16px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-main mark { background: var(--caution-bg); color: inherit; border-radius: 2px; }
  .row .icon-btn { width: 44px; height: 44px; }
  .storage { margin: 12px 4px 0; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--stroke);
             display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--text-2); }
  .storage b { color: var(--text); font-size: 13px; }
  .empty-detail { display: grid; place-items: center; text-align: center; color: var(--text-2); padding: 24px; }

  /* Detail */
  .d-tabs { margin: 0 16px 8px; }
  .tab-body { min-height: 0; display: grid; }
  .tabp { display: none; min-height: 0; }
  body.t-transcript .tabp.transcript, body.t-chats .tabp.chats, body.t-translation .tabp.translation,
  body.t-versions .tabp.versions { display: grid; }
  .tabp.transcript, .tabp.translation { grid-template-rows: auto 1fr; }
  .tabp.versions, .tabp.chats { grid-template-rows: 1fr; }
  /* Explicit rows: hiding the tabs (edit mode, keyboard) must not shift the reading area into an auto row */
  .detail-pane > .appbar, .c-detail > .appbar { grid-row: 1; }
  .detail-pane > .d-tabs, .c-detail > .sources { grid-row: 2; }
  .detail-pane > .tab-body, .c-detail > .msgs { grid-row: 3; }
  .detail-pane > #detailBottom, .c-detail > .composer { grid-row: 4; }
  .appbar .acts { display: flex; gap: 0; }
  .toolbar { display: flex; align-items: center; gap: 4px; padding: 0 12px 6px 16px; min-width: 0; }
  .toolbar .sp { flex: 1; min-width: 0; }
  .toolbar .info { font-size: 12px; line-height: 16px; color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 10px; border: 1px solid var(--stroke);
          border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 13px; white-space: nowrap; max-width: 100%; overflow: hidden; }
  .pick svg { width: 14px; height: 14px; }
  .reader { min-height: 0; overflow: auto; margin: 0 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--stroke); padding: 4px 0; }
  .seg { display: grid; grid-template-columns: 52px 1fr; gap: 4px; min-height: 44px; width: 100%; padding: 6px 12px 6px 8px;
         border: 0; border-left: 3px solid transparent; background: transparent; text-align: left; cursor: pointer;
         font-size: 15px; line-height: 22px; }
  .seg time { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .seg.cur { background: var(--chip-on); border-left-color: var(--accent); }
  .seg .w-cur { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--accent); }
  .seg .orig { display: block; font-size: 13px; line-height: 18px; color: var(--text-2); }
  .seg ins { background: var(--ins); color: var(--ins-text); text-decoration: none; border-radius: 2px; }
  .seg del { background: var(--del); color: var(--del-text); border-radius: 2px; }
  .notice { margin: 0 16px 8px; padding: 8px 12px; border-radius: 8px; font-size: 12px; line-height: 16px;
            background: var(--caution-bg); border: 1px solid var(--caution); }
  .prog { margin: 0 16px 8px; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center;
          font-size: 12px; color: var(--text-2); }
  .prog .bar { grid-column: 1; }

  /* Player bar: Grid "1fr auto auto auto 1fr" keeps Play centred */
  .player { padding: 4px 16px 10px; background: var(--bg); display: grid; gap: 2px; }
  .seek { position: relative; height: 44px; display: grid; align-items: center; cursor: pointer; }
  .seek .track { height: 4px; border-radius: 2px; background: var(--stroke); position: relative; }
  .seek .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
  .seek .track b { position: absolute; top: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); margin-left: -8px; }
  .seek .marks span { position: absolute; top: 12px; width: 2px; height: 6px; background: var(--text-2); opacity: .5; }
  .controls { display: grid; grid-template-columns: minmax(0,1fr) auto auto auto minmax(0,1fr); align-items: center; column-gap: 16px; }
  .controls .time { justify-self: start; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .controls .speed { justify-self: end; }
  .play { width: 56px; height: 56px; border-radius: 28px; border: 0; background: var(--accent); color: var(--accent-text);
          display: grid; place-items: center; cursor: pointer; }
  .play svg { width: 26px; height: 26px; }
  .speed { min-height: 44px; min-width: 52px; border-radius: 22px; border: 1px solid var(--stroke); background: var(--surface); cursor: pointer; font-size: 13px; }
  .player-off { display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: center; padding: 8px 16px 12px; font-size: 12px; color: var(--text-2); }
  /* Short windows (phone landscape): one-row player */
  @media (max-height: 479px) {
    .player { grid-template-columns: auto auto auto 1fr auto auto; align-items: center; column-gap: 8px; padding: 2px 12px 4px; }
    .controls { display: contents; }
    .controls .time { order: 5; } .controls .speed { order: 6; }
    .seek { order: 4; }
    .play { width: 48px; height: 48px; }
    .d-tabs { margin-bottom: 4px; }
    .player-off { padding: 4px 16px; }
  }

  /* Chat */
  .thread-bar { display: grid; grid-template-columns: 1fr 44px; gap: 4px; align-items: center; padding: 0 12px 4px 16px; }
  .thread-bar .ctx { grid-column: 1 / -1; font-size: 12px; line-height: 16px; color: var(--text-2); }
  .msgs { min-height: 0; overflow: auto; padding: 4px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 20px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--stroke); border-bottom-left-radius: 4px; }
  .msg ul { margin: 4px 0; padding-left: 18px; }
  .msg .src { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .msg .src button { min-height: 44px; min-width: 56px; padding: 0 10px; border-radius: 22px; border: 1px solid var(--stroke);
                     background: var(--surface-2); cursor: pointer; font-size: 12px; font-variant-numeric: tabular-nums; }
  .msg .foot { font-size: 11px; color: var(--text-2); margin-top: 4px; }
  .caret { display: inline-block; width: 8px; height: 16px; background: var(--accent); vertical-align: -3px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .hero { text-align: center; padding: 12px 8px 4px; color: var(--text-2); font-size: 13px; }
  .hero b { display: block; color: var(--text); font-size: 15px; margin-bottom: 2px; }
  .quick { display: grid; gap: 6px; }
  @media (min-width: 560px) { .quick { grid-template-columns: 1fr 1fr; } }
  .quick button { min-height: 48px; display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: center; text-align: left;
                  padding: 4px 12px; border-radius: 8px; border: 1px solid var(--stroke); background: var(--surface); cursor: pointer; }
  .quick small { display: block; font-size: 12px; color: var(--text-2); line-height: 16px; }
  .composer { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; align-items: end; padding: 6px 12px 10px; background: var(--bg); }
  .composer .box { min-height: 44px; border-radius: 22px; border: 1px solid var(--stroke); background: var(--surface);
                   padding: 11px 14px; font-size: 14px; line-height: 20px; color: var(--text-2); }
  body.is-kb .composer .box { border-color: var(--accent); color: var(--text); }
  .composer .send { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; cursor: pointer; }
  .composer .send.stop { background: var(--rec); }
  .composer .icon-btn { width: 44px; height: 44px; }
  /* Keyboard open while chatting: the source chips step aside, messages keep the space */
  body.is-kb.is-chat .c-detail > .sources { display: none; }
  body.is-kb .detail-pane > .appbar, body.is-kb .c-detail > .appbar { min-height: 48px; padding-top: 0; padding-bottom: 0; }

  /* Chat sources (a chat reads 1..N recordings): wrapping chips + "Add recording" */
  .sources { padding: 0 16px 6px; display: grid; gap: 4px; }
  .sources .chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .srcchip { display: inline-grid; grid-template-columns: auto auto; gap: 6px; align-items: center; min-height: 44px; max-width: 100%;
             padding: 0 12px; border-radius: 22px; border: 1px solid var(--stroke); background: var(--surface); cursor: pointer;
             font-size: 13px; white-space: nowrap; }
  .srcchip small { color: var(--text-2); font-size: 11px; }
  .srcchip.add { background: transparent; border-style: dashed; grid-template-columns: 16px auto; }
  .srcchip.add svg { width: 16px; height: 16px; }
  .sources .ctx { font-size: 12px; line-height: 16px; color: var(--text-2); }
  /* Narrow or short windows: one summary row (scales to N recordings) → Sources sheet; chips from 600 px wide */
  .srcsum-row { display: grid; grid-template-columns: minmax(0,1fr) 44px; gap: 4px; align-items: center; }
  .srcsum { display: grid; grid-template-columns: 20px auto minmax(0,1fr) 14px; gap: 6px; align-items: center; min-height: 44px; min-width: 0;
            padding: 0 10px; border-radius: 22px; border: 1px solid var(--stroke); background: var(--surface); cursor: pointer; text-align: left; }
  .srcsum b { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .srcsum .names { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .srcsum svg { width: 16px; height: 16px; } .srcsum svg:last-child { width: 14px; height: 14px; }
  .srcsum-row .icon-btn { width: 44px; height: 44px; }
  @media (max-width: 599px), (max-height: 479px) { .sources .wide-only { display: none; } }
  @media (min-width: 600px) and (min-height: 480px) { .sources .narrow-only { display: none; } }
  .srow { display: grid; grid-template-columns: minmax(0,1fr) 44px; gap: 4px; align-items: center; }
  .srow .opt { grid-template-columns: 24px minmax(0,1fr); }
  .srow .icon-btn { width: 44px; height: 44px; }
  .evt { align-self: center; font-size: 12px; line-height: 16px; color: var(--text-2); text-align: center; padding: 2px 10px;
         border-radius: 10px; background: var(--surface-2); border: 1px solid var(--stroke); max-width: 92%; }
  .msg .src button.long { min-width: 0; }

  /* Top-level Chats page: list + conversation, master-detail >= 840 px (same rules as History) */
  .cpage, .solo { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none;
          padding: var(--inset-top) var(--inset-right) max(var(--inset-bottom), var(--kb)) var(--inset-left);
          grid-template-columns: minmax(0,1fr); grid-template-rows: 1fr; }
  body.is-chats .cpage, body.is-chat .cpage, body.is-queue .solo, body.is-settings .solo, body.is-models .solo { display: grid; }
  .c-list { grid-template-rows: auto 1fr; }
  .c-detail { grid-template-rows: auto auto 1fr auto; background: var(--bg); }
  body.is-chat .c-list { display: none; }
  body.is-chats .c-detail { display: none; }
  @media (min-width: 840px) {
    .cpage { grid-template-columns: 360px minmax(0,1fr); }
    body.is-chat .c-list, body.is-chats .c-detail { display: grid; }
    .c-list { border-right: 1px solid var(--stroke); }
    .c-detail .back { visibility: hidden; }
  }
  .row-main .lead.ic { width: 36px; min-width: 36px; height: 36px; padding: 0; border-radius: 18px; }
  .row-main .lead.ic svg { width: 18px; height: 18px; }

  /* Single-column pages: Queue, Settings (content max 720 px, centred on wide windows) */
  .solo-pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
  .solo-scroll { min-height: 0; overflow: auto; padding: 0 16px 16px; }
  .solo-inner { max-width: 720px; margin: 0 auto; display: grid; gap: 8px; align-content: start; }
  .sec-h { margin: 12px 4px 0; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .group { border-radius: 8px; background: var(--surface); border: 1px solid var(--stroke); padding: 4px; display: grid; }
  .group .opt + .opt, .group .usage + .opt { border-top: 1px solid var(--stroke); border-radius: 0; }
  .opt .val { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
  .opt .val svg { width: 14px; height: 14px; }
  .opt.danger { color: var(--del-text); }
  .usage { padding: 8px 8px 10px 44px; display: grid; gap: 6px; font-size: 12px; line-height: 16px; color: var(--text-2); }
  .usage .ubar { display: flex; height: 8px; border-radius: 4px; background: var(--stroke); overflow: hidden; }
  .usage .ubar i { display: block; height: 100%; background: var(--accent); }
  .usage .ubar i.t { background: var(--caution); }
  .usage b { color: var(--text); font-weight: 600; }
  /* Queue jobs */
  .job { gap: 8px; }
  .job-head { display: grid; grid-template-columns: 44px minmax(0,1fr) 44px; gap: 4px; align-items: start; margin: -6px -6px 0 -8px; }
  .job-head .ic { width: 44px; height: 44px; display: grid; place-items: center; color: var(--text-2); }
  .job-head .handle { cursor: grab; }
  .job-head .txt { min-width: 0; padding-top: 4px; display: grid; gap: 2px; }
  .job-head b { font-size: 14px; line-height: 19px; font-weight: 600; }
  .job-head small { font-size: 12px; line-height: 16px; color: var(--text-2); }
  .job .sub { margin: 0 0 0 40px; padding: 0; list-style: none; font-size: 12px; line-height: 18px; color: var(--text-2); }
  .job .sub li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job .chips, .job .kv, .job > .bar { margin-left: 40px; }
  .cond { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; padding: 3px 8px; border-radius: 12px;
          background: var(--chip-on); white-space: nowrap; }
  .cond svg { width: 14px; height: 14px; }
  .cond.warn { background: var(--caution-bg); }

  /* Transcript edit mode: no tabs, no player; segments are text fields; Save creates a new "edited" version */
  body.is-edit .detail-pane > .d-tabs { display: none; }
  .seg.edit { cursor: text; grid-template-columns: 52px minmax(0,1fr); }
  .seg.edit .fld { display: block; border: 1px solid var(--stroke); border-radius: 6px; padding: 5px 8px; background: var(--surface-2); }
  .seg.edit.focus .fld { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); background: var(--surface); }
  .seg.edit.changed time::after { content: " •"; color: var(--accent); font-weight: 700; }
  .editbar { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 8px; align-items: center; padding: 6px 16px 10px; background: var(--bg); }
  .editbar .info { font-size: 12px; line-height: 16px; color: var(--text-2); min-width: 0; }
  @media (max-width: 359px) { .editbar .info { display: none; } .editbar { grid-template-columns: minmax(0,1fr) auto; } .editbar .btn:first-of-type { justify-self: end; } }
  /* Chats tab of a recording: actions + the chats that include it */
  .ask-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
  .ask-row .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; }

  /* Versions */
  .v-scroll { min-height: 0; overflow: auto; padding: 0 16px 16px; display: grid; gap: 8px; align-content: start; }
  .vcard { border-radius: 8px; background: var(--surface); border: 1px solid var(--stroke); padding: 12px; display: grid; gap: 6px; }
  .vcard.cur { border-color: var(--accent); }
  .vcard h3 { margin: 0; font-size: 14px; line-height: 20px; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 2px 12px; font-size: 12px; line-height: 16px; color: var(--text-2); }
  .kv b { color: var(--text); font-weight: 600; }
  .v-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
  .v-actions .grow { flex: 1; font-size: 12px; color: var(--text-2); min-width: 0; }
  .vcard .icon-btn { width: 44px; height: 44px; }
  .diffhead { display: grid; grid-template-columns: 44px 1fr; gap: 6px; align-items: center; }
  .diffpick { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
  .diffpick .pick { justify-content: space-between; }
  .stat { font-size: 12px; color: var(--text-2); }
  .tabp.versions.is-diff { grid-template-rows: auto 1fr; }
  .diff-top { padding: 0 16px 6px; display: grid; gap: 6px; }
  .sbs { display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 839px) { .sbs-only { display: none; } }

  /* Sheets: bottom sheet on phones, centred dialog on wide or short windows */
  .sheet-scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: none; }
  .sheet { position: fixed; z-index: 41; left: var(--inset-left); right: var(--inset-right); bottom: max(var(--inset-bottom), var(--kb));
           max-height: calc(100% - var(--inset-top) - max(var(--inset-bottom), var(--kb)) - 24px);
           background: var(--surface); border-radius: 12px 12px 0 0; box-shadow: var(--shadow); display: none;
           grid-template-rows: auto 1fr auto; }
  body.is-sheet .sheet-scrim { display: block; } body.is-sheet .sheet { display: grid; }
  @media (min-width: 840px), (max-height: 479px) {
    .sheet { left: 50%; right: auto; width: min(480px, calc(100% - var(--inset-left) - var(--inset-right) - 32px));
             transform: translateX(-50%); top: calc(var(--inset-top) + 16px); bottom: auto;
             max-height: calc(100% - var(--inset-top) - var(--inset-bottom) - 32px); border-radius: 12px; }
    body.is-sheet .sheet { display: grid; }
    .sheet.center-v { top: 50%; transform: translate(-50%, -50%); }
  }
  .sheet .s-head { padding: 8px 8px 4px 16px; display: grid; grid-template-columns: 1fr 44px; align-items: center; }
  .sheet .s-head b { font-size: 16px; }
  .sheet .s-head small { display: block; font-size: 12px; color: var(--text-2); line-height: 16px; }
  .sheet .s-body { min-height: 0; overflow: auto; padding: 0 8px 8px; }
  .sheet h4 { margin: 12px 8px 4px; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .opt { width: 100%; min-height: 52px; display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 4px 8px;
         border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; }
  .opt small { display: block; font-size: 12px; line-height: 16px; color: var(--text-2); }
  .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--text-2); }
  .opt.on .radio { border: 6px solid var(--accent); }
  .select { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 44px; padding: 0 12px; margin: 0 8px;
            border-radius: 6px; border: 1px solid var(--stroke); background: var(--surface-2); cursor: pointer; }
  .sheet .s-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 8px 16px 12px; border-top: 1px solid var(--stroke); }
  .sheet .s-foot .est { flex: 1; font-size: 12px; color: var(--text-2); line-height: 16px; align-self: center; min-width: 0; }
  /* Confirmation dialog: centred in the safe area on every window size */
  .sheet.dialog { right: auto; bottom: auto; border-radius: 12px;
                  width: min(400px, calc(100% - var(--inset-left) - var(--inset-right) - 32px));
                  left: calc(var(--inset-left) + (100% - var(--inset-left) - var(--inset-right)) / 2);
                  top: calc(var(--inset-top) + (100% - var(--inset-top) - max(var(--inset-bottom), var(--kb))) / 2);
                  transform: translate(-50%, -50%);
                  max-height: calc(100% - var(--inset-top) - max(var(--inset-bottom), var(--kb)) - 32px); }
  .sheet .s-text { margin: 0 8px 4px; font-size: 14px; line-height: 20px; color: var(--text-2); }
  .cbox { width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--text-2); display: grid; place-items: center; }
  .opt.on .cbox { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .opt[aria-disabled="true"] { opacity: .55; cursor: default; }
  .btn.danger { background: var(--rec); border-color: var(--rec); color: #fff; font-weight: 600; }
  :root[data-theme="dark"] .btn.danger { color: #000; }
  .field { display: grid; grid-template-columns: minmax(0,1fr) 44px; align-items: center; min-height: 44px; margin: 0 8px; padding-left: 12px;
           border-radius: 6px; border: 1px solid var(--accent); box-shadow: inset 0 -2px 0 var(--accent); background: var(--surface); }
  .field span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field .icon-btn { width: 44px; height: 44px; }
  .hint { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 8px; align-items: center; margin: 8px 8px 0;
          font-size: 12px; line-height: 16px; color: var(--text-2); }
  .hint svg { width: 16px; height: 16px; }
  .s-search { margin: 0 8px 4px; }

  /* ════════ Speakers (Nemotron 3 Diarization, on device) ════════ */
  /* 8 speaker colours (the model tells apart up to 8 voices); user can change a speaker's colour */
  :root { --spk0: #0f6cbd; --spk1: #b4009e; --spk2: #107c10; --spk3: #ca5010; --spk4: #5c2e91; --spk5: #038387; --spk6: #986f0b; --spk7: #8e562e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --spk0: #60cdff; --spk1: #ee5fb7; --spk2: #6ccb5f; --spk3: #f7894a; --spk4: #b996e8; --spk5: #4fd1d1; --spk6: #e8c55b; --spk7: #d8a27c; } }
  :root[data-theme="dark"] { --spk0: #60cdff; --spk1: #ee5fb7; --spk2: #6ccb5f; --spk3: #f7894a; --spk4: #b996e8; --spk5: #4fd1d1; --spk6: #e8c55b; --spk7: #d8a27c; }
  .who { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-2); white-space: nowrap; min-width: 0; }
  .who i, .spkdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .who i.unk { background: transparent; border: 1.5px dashed var(--text-2); }
  .seg .who { margin-bottom: 1px; }
  .seg .turn { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 16px; font-weight: 600; color: var(--text-2);
               padding: 0 6px; border-radius: 8px; border: 1px solid var(--stroke); vertical-align: 1px; }
  .seg .turn i { width: 8px; height: 8px; border-radius: 50%; }
  .seg .ovl { text-decoration: underline dotted var(--text-2); text-underline-offset: 4px; }
  .skipnote { margin: 2px 12px 2px 63px; font-size: 12px; line-height: 16px; color: var(--text-2); }
  /* Speaker control: own row < 600 px, inline in the toolbar 600–839 px or on short windows, filter chips on wide + tall windows */
  .spk-row { padding: 0 12px 6px 16px; }
  .spk-inline { display: none !important; }
  .spk-chips { display: none; flex-wrap: wrap; gap: 6px; padding: 0 16px 6px; }
  @media (min-width: 600px) { .spk-row { display: none; } .spk-inline { display: inline-flex !important; } }
  @media (min-width: 840px) and (min-height: 480px) { .spk-inline { display: none !important; } .spk-chips { display: flex; } }
  .spkchip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid var(--stroke);
             background: var(--surface); cursor: pointer; font-size: 13px; white-space: nowrap; }
  .spkchip small { color: var(--text-2); font-size: 11px; }
  .spkchip.on { background: var(--chip-on); border-color: transparent; font-weight: 600; }
  .spkchip svg { width: 16px; height: 16px; }
  .srcsum .spkdot { justify-self: center; }
  /* Speakers sheet rows: colour swatch · name (tap = rename) · more */
  .spkrow { display: grid; grid-template-columns: 44px minmax(0,1fr) 44px; gap: 4px; align-items: center; }
  .spkrow .sw { width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; display: grid; place-items: center; cursor: pointer; }
  .spkrow .sw i { width: 20px; height: 20px; border-radius: 50%; }
  .spkrow .opt { grid-template-columns: minmax(0,1fr) auto; }
  .spkrow .opt svg { width: 16px; height: 16px; color: var(--text-2); }
  .spkrow .icon-btn { width: 44px; height: 44px; }
  .opt .spkdot { justify-self: center; }
  /* Main screen while recording with live speaker labels */
  .card .body .ll { margin: 0 0 10px; }
  .card .body .ll.pending { color: var(--text-2); }
  .record.stop { background: var(--rec); }
  /* Reprocess chain steps (Versions card, Queue) */
  .steps { margin: 0 0 0 40px; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 12px; line-height: 18px; color: var(--text-2); }
  .vcard > .steps { margin-left: 0; }
  .steps li { display: grid; grid-template-columns: 16px minmax(0,1fr); gap: 6px; align-items: center; }
  .steps li.run { color: var(--text); font-weight: 600; }
  .steps svg { width: 14px; height: 14px; }
  /* Insights (analysis step): summary, action items with owners, talk time */
  .ins ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 19px; }
  .ins .lbl { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
  .ai { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; min-height: 44px; width: 100%; padding: 4px 10px;
        border: 0; border-radius: 6px; background: var(--surface-2); text-align: left; cursor: pointer; font-size: 13px; line-height: 18px; }
  .ai .who { margin-bottom: 1px; }
  .ai time { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .talk { display: grid; grid-template-columns: 92px minmax(0,1fr) auto; gap: 8px; align-items: center; font-size: 12px; line-height: 16px; color: var(--text-2); }
  .talk .tbar { height: 8px; border-radius: 4px; background: var(--stroke); overflow: hidden; }
  .talk .tbar i { display: block; height: 100%; }
  .talk .who { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  /* Models page: variant rows (choice + download / more) */
  .vrow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; }

  // ── Layout check ─────────────────────────────────────────────────────────
  function check() {
    const vw = innerWidth, vh = innerHeight;
    const n = k => parseInt(S[k] || '0', 10) || 0;
    const safe = { l: n('left'), t: n('top'), r: vw - n('right'), b: vh - Math.max(n('bottom'), n('kb')) };
    const short = vh < 480;
    const visible = el => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
    const layerOf = el => el.closest('.sheet') ? 'sheet' : el.closest('.drawer') ? 'drawer' : el.closest('.hist, .cpage, .solo') ? 'page' : 'main';
    const active = cls.contains('is-sheet') ? 'sheet' : cls.contains('is-drawer') ? 'drawer' : screen !== 'main' ? 'page' : 'main';
    const els = [...document.querySelectorAll('[data-hit]')].filter(visible).filter(el => layerOf(el) === active);
    const issues = [];
    const scrollParent = el => { for (let p = el.parentElement; p; p = p.parentElement) { const s = getComputedStyle(p).overflowY; if ((s === 'auto' || s === 'scroll') && p.scrollHeight > p.clientHeight) return p; } return null; };
    const clip = (r, el) => { const sp = scrollParent(el); if (!sp) return r; const c = sp.getBoundingClientRect();
      const l = Math.max(r.left, c.left), t = Math.max(r.top, c.top), rr = Math.min(r.right, c.right), b = Math.min(r.bottom, c.bottom);
      return { left: l, top: t, right: Math.max(l, rr), bottom: Math.max(t, b) }; };
    const rects = els.map(el => ({ id: el.dataset.hit, r: el.getBoundingClientRect(), v: clip(el.getBoundingClientRect(), el), el }));
    const tol = 0.5;
    for (const { id, r, el } of rects) {
      const sp = scrollParent(el);
      const box = sp ? sp.getBoundingClientRect() : r;
      if (!sp && (r.left < safe.l - tol || r.top < safe.t - tol || r.right > safe.r + tol || r.bottom > safe.b + tol))
        issues.push(`${id}: outside safe area [${r.left|0},${r.top|0},${r.right|0},${r.bottom|0}] vs [${safe.l},${safe.t},${safe.r},${safe.b}]`);
      if (sp && (box.left < safe.l - tol || box.top < safe.t - tol || box.right > safe.r + tol || box.bottom > safe.b + tol))
        issues.push(`${id}: scroll container outside safe area`);
      if (r.width < 44 - tol || r.height < 44 - tol) issues.push(`${id}: hit target ${r.width.toFixed(0)}x${r.height.toFixed(0)} < 44x44`);
      if (el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflow !== 'visible') issues.push(`${id}: label clipped (${el.scrollWidth} > ${el.clientWidth})`);
    }
    for (let i = 0; i < rects.length; i++)
      for (let j = i + 1; j < rects.length; j++) {
        const a = rects[i].v, c = rects[j].v;
        const ox = Math.min(a.right, c.right) - Math.max(a.left, c.left);
        const oy = Math.min(a.bottom, c.bottom) - Math.max(a.top, c.top);
        if (ox > 0.5 && oy > 0.5) issues.push(`${rects[i].id} overlaps ${rects[j].id} (${ox.toFixed(0)}x${oy.toFixed(0)})`);
      }
    const minRead = short ? 72 : 96;
    const area = (sel, name) => { for (const e of document.querySelectorAll(sel)) if (visible(e)) { const h = e.getBoundingClientRect().height; if (h < minRead - tol) issues.push(`${name}: reading area ${h.toFixed(0)} px < ${minRead}`); } };
    if (active === 'main') {
      const rec = rects.find(x => x.id === 'record');
      if (rec) { const dx = (rec.r.left + rec.r.right) / 2 - (safe.l + safe.r) / 2; if (Math.abs(dx) > 1) issues.push(`record: not centred (dx=${dx.toFixed(1)})`); }
      area('#main .card', 'transcript card');
      const sn = document.getElementById('snackRow');
      if (visible(sn)) { const a = sn.getBoundingClientRect(), b = document.querySelector('.cmdbar').getBoundingClientRect();
        if (a.bottom > b.top + tol) issues.push('snackbar overlaps the command bar'); }
    }
    if (active === 'page') {
      area('.list-scroll', 'history list');
      area('body.t-transcript .tabp.transcript .reader', 'transcript');
      area('body.t-translation .tabp.translation .reader', 'translation');
      area('.cpage .msgs', 'chat messages');
      area('.tabp.versions.is-diff .reader', 'diff');
      area('.tabp.versions .v-scroll', 'versions list');
      area('.tabp.chats .v-scroll', 'recording chats');
      area('.solo-scroll', screen);
      const play = rects.find(x => x.id === 'play');
      if (play && !short) { const bar = document.getElementById('player').getBoundingClientRect();
        const dx = (play.r.left + play.r.right) / 2 - (bar.left + bar.right) / 2;
        if (Math.abs(dx) > 1) issues.push(`play: not centred in the player (dx=${dx.toFixed(1)})`); }
    }
    return { viewport: `${vw}x${vh}`, safe, layer: active, checked: rects.map(x => x.id), issues, ok: issues.length === 0 };
  }
  if (S.check === '1') {
    const report = JSON.stringify(check());
    document.getElementById('check').textContent = report;
    if (parent !== window) parent.postMessage(report, '*');
  }
